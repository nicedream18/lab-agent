# Use with the root compose file; only these two named services are started.
services:
  incident-upstream:
    image: lab-agent-backend:local
    pull_policy: never
    command: ["python", "-m", "app.server", "--app", "incident_app:upstream"]
    environment:
      PYTHONPATH: /drill:/app
      LOG_SERVICE_NAME: lab-agent-drill-upstream
      LOG_ENVIRONMENT: incident-drill
    volumes:
      - ./deploy/drills/incident_app.py:/drill/incident_app.py:ro
    mem_limit: 256m
    restart: "no"

  incident-api:
    image: lab-agent-backend:local
    pull_policy: never
    command: ["python", "-m", "app.server", "--app", "incident_app:api"]
    environment:
      PYTHONPATH: /drill:/app
      LOG_SERVICE_NAME: lab-agent-drill
      LOG_ENVIRONMENT: incident-drill
      LOG_FILE: /app/logs/incident-drill.jsonl
    volumes:
      - ./deploy/drills/incident_app.py:/drill/incident_app.py:ro
      - app-logs:/app/logs
    ports:
      - "127.0.0.1:${INCIDENT_DRILL_PORT:-8010}:8000"
    depends_on:
      incident-upstream:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"
