global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: lab-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  # Empty until an explicitly started exercise registers its temporary target.
  - job_name: lab-agent-drill
    file_sd_configs:
      - files: ["/etc/prometheus/drills/*.json"]
        refresh_interval: 5s
