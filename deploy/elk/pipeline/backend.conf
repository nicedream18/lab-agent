input {
  file {
    id => "lab-agent-json-files"
    path => ["/var/log/lab-agent/*.jsonl"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/lab-agent.sincedb"
    sincedb_write_interval => 1
    stat_interval => 1
    discover_interval => 2
    ecs_compatibility => "v8"
    codec => json { ecs_compatibility => "disabled" }
  }
}

filter {
  mutate { add_field => { "[event][dataset]" => "lab_agent.backend" } }
}

output {
  elasticsearch {
    id => "lab-agent-elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    user => "lab_agent_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "lab-agent-logs-%{+yyyy.MM.dd}"
    action => "create"
    data_stream => false
    ilm_enabled => false
    manage_template => false
    ecs_compatibility => "v8"
  }
}
