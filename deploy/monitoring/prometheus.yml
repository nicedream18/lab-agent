global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: lab-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # If METRICS_TOKEN is enabled, mount a token file and uncomment:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics-token
